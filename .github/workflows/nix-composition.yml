name: Agda and static Pages verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Verify the pinned Agda / Fennel / Pages surface
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Verify official dependencies and retired subsystems
        run: nix develop .#agda-ci -c scsh -s .ci/scsh/verify-official-nix-surface.scsh

  agda-learner:
    name: Type-check canonical learner monolith
    needs: policy
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Type-check learner with unchanged source options
        run: nix develop .#agda-ci -c scsh -s .ci/scsh/ci-lanes.scsh AgdaLearner

  agda-theorem:
    name: Type-check theorem monolith and RUSS relative result
    needs: policy
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Type-check theorem monolith with unchanged source options
        run: nix develop .#agda-ci -c scsh -s .ci/scsh/ci-lanes.scsh AgdaTheorem

  pages:
    name: Build and verify immutable static Pages
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs: [policy, agda-learner, agda-theorem]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Build static Pages from the two monoliths
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/pages
        run: |
          set -euo pipefail
          nix develop .#presentation -c scsh -s .ci/scsh/ci-lanes.scsh Pages
          test -s "${RUNNER_TEMP}/pages/index.html"
          test -s "${RUNNER_TEMP}/pages/site.css"
          ! test -e "${RUNNER_TEMP}/pages/app.mjs"
          ! test -e "${RUNNER_TEMP}/pages/render.mjs"
          ! grep -Eiq '<script|<input|<button|filter-row|siteSearchMatches' "${RUNNER_TEMP}/pages/index.html"
