name: Agda RUSS and static Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Verify retained surface
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Policy and Dhall contracts
        run: |
          nix develop .#agda-ci -c scsh -s .ci/scsh/verify-official-nix-surface.scsh
          nix develop .#agda-ci -c dhall type --file .ci/actions_ci.dhall
          nix develop .#agda-ci -c dhall type --file .ci/presentation-contract.dhall

  agda:
    name: Type-check both canonical Agda monoliths
    needs: policy
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Check both canonical monoliths
        run: nix develop .#agda-ci -c scsh -s .ci/scsh/ci-lanes.scsh AgdaTheorem

  russ:
    name: RUSS operational and trust-boundary inventory
    needs: policy
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Type-check and inventory RUSS contracts
        run: nix develop .#agda-ci -c scsh -s .ci/scsh/ci-lanes.scsh RUSS

  pages:
    name: Generate static Pages
    needs: policy
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Render HTML and CSS
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/pages
        run: nix develop .#presentation -c scsh -s .ci/scsh/ci-lanes.scsh Pages
