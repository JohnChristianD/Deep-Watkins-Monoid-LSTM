name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-pages.yml"
      - "FullCoupled/**"
      - ".ci/**"
      - "site/**"
      - "index.html"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static JavaScript Pages surface
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'

      - name: Generate and verify Agda-native JavaScript presentation
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/pages
        run: |
          set -euo pipefail
          nix develop .#presentation -c scsh -s .ci/scsh/ci-lanes.scsh Pages
          test -s "${RUNNER_TEMP}/pages/index.html"
          test -s "${RUNNER_TEMP}/pages/site.css"
          test -s "${RUNNER_TEMP}/pages/app.mjs"
          test -s "${RUNNER_TEMP}/pages/monolith-content.js"
          test -s "${RUNNER_TEMP}/pages/jAgda.FullCoupled.Agda2HsSemanticExtractor.mjs"
          ! test -e "${RUNNER_TEMP}/pages/app.js"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "${{ runner.temp }}/pages"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
