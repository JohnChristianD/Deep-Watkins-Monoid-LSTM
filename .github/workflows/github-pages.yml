name: Agda, Teal, RUSS, and static Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-end-to-end
  cancel-in-progress: true

jobs:
  build:
    name: End-to-end Agda, RUSS, and Pages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'
      - name: Restore Nix store
        id: nix-store-cache
        uses: nix-community/cache-nix-action/restore@b16f249a0248efec86dd9d4224cb75f1ffa48bcc
        with:
          primary-key: nix-${{ runner.os }}-gcroot-v2-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-
      - name: Cache Agda interfaces, Teal, Lua Lanes, and primitive data
        uses: actions/cache@v6
        with:
          path: |
            _build
            .cache
            .luarocks
          save-always: true
          key: agda-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '.ci/agda/global-options.txt', '.ci/agda/agda2hs.yaml', '.ci/teal/*.tl', '**/*.agda') }}
          restore-keys: |
            agda-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', '.ci/agda/global-options.txt', '.ci/agda/agda2hs.yaml', '.ci/teal/*.tl') }}-
      - name: Root the Nix devShell for cache retention
        run: |
          mkdir -p .cache/nix-roots
          time -p nix build .#devShells.x86_64-linux.agda-ci \
            --out-link .cache/nix-roots/agda-ci
      - name: Type-check, audit, and render
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/pages
          XDG_CACHE_HOME: ${{ github.workspace }}/.cache
          NIX_CONFIG: |
            max-jobs = 1
            cores = 1
        shell: bash
        run: |
          set -o pipefail
          time -p nix develop -L .#agda-ci -c bash -euo pipefail -c '
            tl check .ci/teal/ci.tl
            mkdir -p build/teal
            cp .ci/teal/ci.tl build/teal/ci.tl
            tl gen --output build/teal/ci.lua build/teal/ci.tl
            exec luajit build/teal/ci.lua All
          ' 2>&1 | sed '/^copying path .* from .*$/d'
      - name: Save Nix store, including successful dependencies from failed builds
        if: always() && steps.nix-store-cache.outcome == 'success' && steps.nix-store-cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@b16f249a0248efec86dd9d4224cb75f1ffa48bcc
        with:
          primary-key: nix-${{ runner.os }}-gcroot-v2-${{ hashFiles('flake.nix', 'flake.lock') }}
          gc-max-store-size-linux: 12G
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "${{ runner.temp }}/pages"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Verify GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
