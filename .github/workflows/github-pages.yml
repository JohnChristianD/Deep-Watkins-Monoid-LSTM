name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-pages.yml"
      - "FullCoupled/**"
      - ".ci/**"
      - "site/**"
      - "flake.nix"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/github-pages.yml"
      - "FullCoupled/**"
      - ".ci/**"
      - "site/**"
      - "flake.nix"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    name: Build Agda-synchronized Elm Pages surface
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
        with:
          installer-version: '2.35.1'

      - name: Verify and compile static Elm presentation
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pages"
          CI_LANE='(< AgdaLearner | AgdaTheorem | AgdaSafe | Agda2Hs | FennelPresentation | Pages | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | AutoMerge | All >.Pages) : < AgdaLearner | AgdaTheorem | AgdaSafe | Agda2Hs | FennelPresentation | Pages | Discovery | EconlibCrossrepo | EconlibEquilibriumSearch | StrictExistenceImpossibility | StationaryCycleImpossibility | IsomorphismTransport | SemanticContract | Surface | Versions | AutoMerge | All >' PAGES_OUTPUT_DIR="${RUNNER_TEMP}/pages" \
            nix develop .#presentation -c bash -e -c 'dhall text --file .ci/actions_ci.dhall | bash -e'
          test -s "${RUNNER_TEMP}/pages/elm.js"

      - name: Create Pages shell
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY##*/}"
          cat > "${RUNNER_TEMP}/pages/index.html" <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>${repo_name}</title>
            <style>
              :root { color-scheme: light dark; }
              body { max-width: 960px; margin: 0 auto; padding: 2rem; font: 16px/1.6 system-ui, sans-serif; }
              code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
              a { text-decoration-thickness: .08em; text-underline-offset: .15em; }
              .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
              .panel { border: 1px solid currentColor; border-radius: .6rem; padding: 1rem; opacity: .9; }
            </style>
          </head>
          <body>
            <div id="app"></div>
            <script src="elm.js"></script>
            <script>Elm.Main.init({ node: document.getElementById("app") });</script>
          </body>
          </html>
          HTML
          touch "${RUNNER_TEMP}/pages/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "${{ runner.temp }}/pages"

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
